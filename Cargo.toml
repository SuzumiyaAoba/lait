[package]
name = "lait"
version = "0.3.0"
edition = "2024"
description = "Lightweight AI Tool"
license = "MIT"
repository = "https://github.com/SuzumiyaAoba/lait"
rust-version = "1.88"

# `cargo binstall lait` resolves release artifacts through this metadata
# (the release workflow names its archives to match).
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.tar.gz"
bin-dir = "{ name }-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.zip"
pkg-fmt = "zip"

# Deliberately does NOT include `[lints.rust] warnings = "deny"` or an
# equivalent blanket clippy deny: that would make every `cargo build`/`cargo
# check` fail on an in-progress edit (an unused variable, say), which is
# exactly why this repo enforces `-D warnings` on the CI/`makers clippy`
# command line (see `.github/workflows/ci.yml`, `Makefile.toml`) instead of
# here. What's declared below are specific, narrow lints worth catching on
# every local build regardless of edit-in-progress noise — verified via
# `grep` rather than a `cargo clippy` run (clippy is not available as a
# component in every dev environment this crate is built in — a bare `cargo`
# on `PATH` may lack the component even though this repo's own `flake.nix`
# dev shell has one; see AGENTS.md's "Build, Test, and Development Commands"
# for how to reach it, which lets these four lints be checked by running
# clippy, not only by grep).
[lints.clippy]
# `src/` has zero uses of `dbg!`/`todo!`/`unimplemented!` today (verified by
# grep across the tree, including test modules). All three are markers of
# code that was never meant to reach a commit, so denying them locally
# catches a leftover before it reaches review rather than waiting for CI.
# (`.unwrap()` is deliberately not covered here: `src/` proper already has
# zero non-test `.unwrap()` calls, sustained by review rather than by this
# lint. Enabling `clippy::unwrap_used` crate-wide to guard that was
# reconsidered once a working `cargo clippy` was available to check against
# (see the dev-shell note above) — and rejected on the numbers it surfaced,
# not on tooling availability: doing so would require a
# `#[allow(clippy::unwrap_used)]` on every one of the ~40 `#[cfg(test)]`
# modules that use `.unwrap()` freely and idiomatically on data the test
# itself just constructed, replacing this crate's current one-`#[allow]`
# total with dozens. That trades a real amount of noise for a lint whose
# only enforcement surface — non-test code — is already clean without it.)
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
# Added once the crate's last `unreachable!()` (lint/report.rs's
# `run_structured`) was removed by narrowing its parameter type
# (`StructuredFormat`, which has no `Text` variant to fall through to) —
# see that module's doc comment. Verified crate-wide by grep, same as the
# three lints above; `cargo clippy`'s own check would additionally catch a
# match arm that merely panics without the macro, but that's out of scope
# for a grep-only local gate.
unreachable = "deny"

[dependencies]
anyhow = "1"
async-openai = { version = "0.41.3", default-features = false, features = ["byot", "chat-completion", "responses", "rustls-no-provider"] }
base64 = "0.23.1"
bytes = "1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive", "env", "string"] }
clap_complete = "4.6.9"
clap_mangen = "0.3.3"
fs2 = "0.4.3"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
handlebars = "6.4.4"
http = "1"
libc = "0.2"
process-wrap = { version = "10", default-features = false, features = ["tokio1", "process-group", "job-object", "kill-on-drop"] }
jaq-core = "3.1.0"
jaq-json = { version = "2.0.2", features = ["serde"] }
jaq-std = "3.0.2"
reqwest = { version = "0.13", default-features = false }
rmcp = { version = "3.1.4", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "server", "transport-io"] }
# Selects the `ring` crypto provider (see `main`'s
# `rustls::crypto::ring::default_provider().install_default()` call) instead
# of rustls's default `aws-lc-rs`, whose `aws-lc-sys` build script needs a C/
# assembly toolchain (see `scripts/makers-cargo.sh`'s and this workflow's now
# largely dormant macOS/NASM workarounds). `async-openai`'s `rustls-no-provider`
# feature (below) pulls in `rustls` without a provider baked in, so this crate
# gets to pick the one actually installed at runtime.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = { package = "serde_yaml_ng", version = "0.10" }
sha2 = "0.10"
sse-stream = "0.2.5"
termimad = "0.35.2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "process", "io-util", "io-std", "fs", "sync", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
# `default-features = false` + `tls-ring` (replacing the default
# `tls-aws-lc-rs`) so test builds don't pull in `aws-lc-sys` either — see the
# `rustls`/`async-openai` comments above.
jsonschema = { version = "0.53.0", default-features = false, features = ["resolve-http", "resolve-file", "idna", "tls-ring"] }

# `panic = "abort"` is deliberately not set here: several tests rely on
# catching a panic (or on ordinary unwinding during teardown), and `abort`
# would take the whole test process down instead.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Two independent levers for the debug profile (`cargo check`/`build`/`test`
# with no `--release`), previously left at cargo's own defaults:
#
# - `debug = "line-tables-only"` keeps enough debug info for a panic
#   backtrace to show file/line (what this crate's own tests and any user's
#   `RUST_BACKTRACE=1` run need), while dropping the much larger variable/
#   type debug info `cargo`'s default `debug = true` also generates — that
#   extra data is what a source-level debugger (lldb/gdb stepping through
#   local variables) needs, which this project's own edit/build/test loop
#   does not rely on. Less debug info to emit and link measurably shortens
#   incremental rebuilds, which is the loop `cargo check`/`test` run in for
#   every edit.
# - `[profile.dev.package."*"] opt-level = 2` optimizes every *dependency*
#   (not this crate's own code, which stays unoptimized for fast
#   incremental recompiles) once, the first time it's built; from then on
#   its already-optimized .rlib is reused as-is across every subsequent
#   `cargo check`/`build`/`test` invocation, incremental or not — unlike
#   `debug`, this is a one-time cost paid on the first (or next dependency-
#   changing) build, not on every edit. It matters here specifically
#   because `cargo test` spawns the built `lait` binary as a real subprocess
#   dozens of times across `tests/*.rs`'s ~40 integration test binaries;
#   unoptimized dependency code (JSON parsing, YAML parsing, TLS, hashing)
#   in every one of those spawned processes is what this targets. If this
#   ever measures as a net loss in this project's own CI (unlikely, since
#   `Swatinem/rust-cache` reuses `target/` across pushes there, hiding the
#   one-time cost entirely — see AGENTS.md's "Refactoring Conventions" for
#   the measurement protocol used to add these two lines), drop the
#   dependency opt-level to 1 before removing it outright.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
