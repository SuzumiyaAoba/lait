[package]
name = "lait"
version = "0.1.0"
edition = "2024"
description = "Lightweight AI Tool"
rust-version = "1.85"

[dependencies]
anyhow = "1"
async-openai = { version = "0.41.3", default-features = false, features = ["byot", "chat-completion", "rustls"] }
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
