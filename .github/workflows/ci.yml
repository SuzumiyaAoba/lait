name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # Split from `test` (rather than one `checks` job running fmt/clippy then
  # tests in sequence) so a clippy or fmt regression can never hide a test
  # regression: the two used to share a job, and when clippy started
  # failing on a newer toolchain, `cargo test` after it in the same step
  # list never ran at all — a decisive test failure (a broken SIGINT
  # checkpoint path) went undetected on `master` for several commits.
  # Independent jobs run in parallel and both always report their own
  # status regardless of the other's outcome.
  lint:
    name: Rust lint (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --locked

      # `cargo test` above already built and ran the debug profile; a release
      # build is a from-scratch compile under a different profile (and, as of
      # `[profile.release]` in Cargo.toml, LTO), so it can't reuse those
      # artifacts. Limited to `master`/tags rather than every push and PR to
      # avoid paying for a second full compile on every commit.
      - name: Build release binary
        if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        run: cargo build --release --locked

  msrv:
    name: Rust MSRV check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install MSRV Rust toolchain
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Cache MSRV Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: msrv

      - name: Check MSRV
        run: cargo check --locked --all-targets

  native-locks:
    name: Native file locks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run file lock tests
        run: 'cargo test --locked --bin lait file_lock::'

      - name: Run cancellable filesystem tests
        run: 'cargo test --locked --bin lait async_io::'

  website:
    name: Website checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check and build website
        run: pnpm build
